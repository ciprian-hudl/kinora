name: Deploy cloud

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag to publish
        type: string
        default: latest
        required: true
      deploy_web:
        description: Build and deploy the web image
        type: boolean
        default: true
      deploy_server:
        description: Build and deploy the server image
        type: boolean
        default: true
      trigger_deploy:
        description: Trigger Dokploy after pushing images
        type: boolean
        default: true
      no_cache:
        description: Build without Docker cache
        type: boolean
        default: false
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: deploy-cloud
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.meta.outputs.should_deploy }}
      tag: ${{ steps.meta.outputs.tag }}
      deploy_web: ${{ steps.meta.outputs.deploy_web }}
      deploy_server: ${{ steps.meta.outputs.deploy_server }}
      trigger_deploy: ${{ steps.meta.outputs.trigger_deploy }}
      no_cache: ${{ steps.meta.outputs.no_cache }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve deploy metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag || 'latest' }}
          INPUT_DEPLOY_WEB: ${{ inputs.deploy_web || false }}
          INPUT_DEPLOY_SERVER: ${{ inputs.deploy_server || false }}
          INPUT_TRIGGER_DEPLOY: ${{ inputs.trigger_deploy || false }}
          INPUT_NO_CACHE: ${{ inputs.no_cache || false }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_EVENT_NAME" = 'workflow_run' ]; then
            subject="$(git log -1 --pretty=%s)"
            echo "Commit subject: $subject"

            if [[ ! "$subject" =~ ^release:\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "should_deploy=false" >> "$GITHUB_OUTPUT"
              echo "Release workflow did not run for a release commit, skipping cloud deploy."
              exit 0
            fi

            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "deploy_web=true" >> "$GITHUB_OUTPUT"
            echo "deploy_server=true" >> "$GITHUB_OUTPUT"
            echo "trigger_deploy=true" >> "$GITHUB_OUTPUT"
            echo "no_cache=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          echo "tag=$INPUT_TAG" >> "$GITHUB_OUTPUT"
          echo "deploy_web=$INPUT_DEPLOY_WEB" >> "$GITHUB_OUTPUT"
          echo "deploy_server=$INPUT_DEPLOY_SERVER" >> "$GITHUB_OUTPUT"
          echo "trigger_deploy=$INPUT_TRIGGER_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "no_cache=$INPUT_NO_CACHE" >> "$GITHUB_OUTPUT"

  web:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_deploy == 'true' && needs.prepare.outputs.deploy_web == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/web/Dockerfile
          platforms: linux/amd64
          no-cache: ${{ needs.prepare.outputs.no_cache }}
          push: true
          provenance: false
          tags: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.WEB_IMAGE }}:${{ needs.prepare.outputs.tag }}
          build-args: |
            VITE_KINORA_SERVER_URL=https://api.kinora.dev
            VITE_KINORA_CLOUD=true
            VITE_KINORA_SENTRY_DSN=https://c68ee4001641f5156e9e902c25ea1734@o1155685.ingest.us.sentry.io/4511622830751744
            SENTRY_ORG=joris-gallot
            SENTRY_PROJECT=kinora-frontend
            VITE_UMAMI_WEBSITE_ID=3324f96d-2efa-44a6-af16-a829f3626864
          secrets: |
            sentry_auth_token=${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Trigger web deploy in Dokploy
        if: ${{ needs.prepare.outputs.trigger_deploy == 'true' }}
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_WEB_COMPOSE_ID }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          WEB_IMAGE: ${{ secrets.WEB_IMAGE }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ]; then
            echo "DOKPLOY_URL and DOKPLOY_API_KEY must be configured."
            exit 1
          fi

          if [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "DOKPLOY_WEB_COMPOSE_ID must be configured."
            exit 1
          fi

          DOKPLOY_DEPLOY_URL="$DOKPLOY_URL/api/compose.deploy"

          PAYLOAD=$(jq -n \
            --arg composeId "$DOKPLOY_COMPOSE_ID" \
            --arg title "Deploy kinora web" \
            --arg description "GitHub Actions run $GITHUB_RUN_NUMBER: $DOCKER_REGISTRY/$WEB_IMAGE:$TAG" \
            '{ composeId: $composeId, title: $title, description: $description }')

          curl -fsSL -X POST "$DOKPLOY_DEPLOY_URL" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            --data "$PAYLOAD"

  server:
    needs: prepare
    if: ${{ needs.prepare.outputs.should_deploy == 'true' && needs.prepare.outputs.deploy_server == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Build and push server image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: packages/server/Dockerfile
          platforms: linux/amd64
          no-cache: ${{ needs.prepare.outputs.no_cache }}
          push: true
          provenance: false
          tags: ${{ secrets.DOCKER_REGISTRY }}/${{ secrets.SERVER_IMAGE }}:${{ needs.prepare.outputs.tag }}

      - name: Trigger server deploy in Dokploy
        if: ${{ needs.prepare.outputs.trigger_deploy == 'true' }}
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_COMPOSE_ID: ${{ secrets.DOKPLOY_SERVER_COMPOSE_ID }}
          DOCKER_REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
          SERVER_IMAGE: ${{ secrets.SERVER_IMAGE }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "$DOKPLOY_URL" ] || [ -z "$DOKPLOY_API_KEY" ]; then
            echo "DOKPLOY_URL and DOKPLOY_API_KEY must be configured."
            exit 1
          fi

          if [ -z "$DOKPLOY_COMPOSE_ID" ]; then
            echo "DOKPLOY_SERVER_COMPOSE_ID must be configured."
            exit 1
          fi

          DOKPLOY_DEPLOY_URL="$DOKPLOY_URL/api/compose.deploy"

          PAYLOAD=$(jq -n \
            --arg composeId "$DOKPLOY_COMPOSE_ID" \
            --arg title "Deploy kinora server" \
            --arg description "GitHub Actions run $GITHUB_RUN_NUMBER: $DOCKER_REGISTRY/$SERVER_IMAGE:$TAG" \
            '{ composeId: $composeId, title: $title, description: $description }')

          curl -fsSL -X POST "$DOKPLOY_DEPLOY_URL" \
            -H "Content-Type: application/json" \
            -H "x-api-key: $DOKPLOY_API_KEY" \
            --data "$PAYLOAD"
